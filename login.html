<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Inter',system-ui,sans-serif;}
body{
  min-height:100vh;min-height:100dvh;
  background:linear-gradient(170deg,#4B1320 0%,#2a0b12 55%,#000000 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,2.5rem) 1.4rem env(safe-area-inset-bottom,2rem);
  position:relative;overflow:hidden;
}
.overlay{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(170deg,rgba(75,19,32,0.82) 0%,rgba(20,8,14,0.80) 55%,rgba(0,0,0,0.85) 100%);
  pointer-events:none;z-index:0;
}
.glow{
  position:absolute;top:-80px;left:50%;transform:translateX(-50%);
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(184,134,47,.14) 0%,transparent 65%);
  pointer-events:none;
}
.golfer-silhouette{
  position:absolute;bottom:-20px;right:-30px;
  width:340px;height:420px;
  pointer-events:none;user-select:none;
  opacity:1;
}
.golfer-silhouette img{
  width:100%;height:100%;
  object-fit:contain;object-position:bottom right;
  filter:invert(1) sepia(1) saturate(0.4) hue-rotate(5deg) brightness(0.7);
  opacity:0.07;
}

/* top — logo and name */
.top{
  display:flex;flex-direction:column;align-items:center;
  gap:1.4rem;position:relative;z-index:1;
  flex:1;justify-content:center;padding-bottom:3rem;
}
.logo-ring{
  width:130px;height:145px;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 4px 24px rgba(0,0,0,0.5));
}
.logo-ring img{width:100%;height:100%;object-fit:contain;mix-blend-mode:lighten;}
.logo-placeholder{
  width:64px;height:64px;border-radius:50%;
  background:rgba(184,134,47,.15);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;color:rgba(184,134,47,.6);
}
.society-name{
  font-size:1.9rem;font-weight:800;color:#FAF8F2;
  text-align:center;letter-spacing:-.03em;line-height:1.1;
}
.society-loc{
  font-size:.65rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.14em;color:rgba(184,134,47,.75);
  text-align:center;margin-top:.3rem;
}

/* bottom — pills and actions */
.bottom{width:100%;max-width:420px;position:relative;z-index:1;}

.pills{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.75rem;}
.pill{
  border-radius:14px;padding:.9rem .8rem;
  display:flex;flex-direction:column;gap:.4rem;
  cursor:pointer;transition:all .2s;border:1px solid transparent;
}
.pill.first{background:rgba(184,134,47,.1);border-color:rgba(184,134,47,.3);}
.pill.member{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);}
.pill.active-pill{border-width:1.5px;}
.pill.first.active-pill{border-color:rgba(184,134,47,.6);background:rgba(184,134,47,.15);}
.pill.member.active-pill{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1);}
.pill.dimmed{opacity:.3;}
.pill-icon{
  width:30px;height:30px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-size:14px;
}
.pill-icon.em{background:linear-gradient(135deg,#6b1c2e,#9B2C3B);}
.pill-icon.pk{background:linear-gradient(135deg,#7a4a10,#B8862F);}
.pill-title{font-size:.78rem;font-weight:700;color:#FAF8F2;letter-spacing:-.01em;}
.pill-desc{font-size:.62rem;color:rgba(255,255,255,.5);line-height:1.35;}

/* revealed panels */
.panel{
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  border-radius:14px;padding:1rem;
  margin-bottom:.75rem;
  animation:fadeUp .2s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.inp-label{
  font-size:.6rem;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:rgba(255,255,255,.4);
  display:block;margin-bottom:.4rem;
}
.inp-wrap{position:relative;margin-bottom:.65rem;}
.inp-field{
  width:100%;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;
  padding:.65rem .85rem .65rem 2.4rem;
  font-family:'Inter',system-ui,sans-serif;font-size:.92rem;
  color:#FAF8F2;outline:none;transition:border-color .15s;
}
.inp-field::placeholder{color:rgba(255,255,255,.25);}
.inp-field:focus{border-color:rgba(184,134,47,.6);}
.inp-ico{
  position:absolute;bottom:.7rem;left:.75rem;
  font-size:16px;color:rgba(255,255,255,.35);
}
.btn-gold{
  width:100%;border:none;border-radius:10px;padding:.72rem;
  font-family:'Inter',system-ui,sans-serif;font-size:.92rem;font-weight:700;
  color:#1a1008;letter-spacing:-.01em;cursor:pointer;
  background:linear-gradient(135deg,#B8862F,#E3C173 50%,#B8862F);
  background-size:200% auto;transition:background-position .3s;
}
.btn-gold:hover{background-position:right center;}

.btn-passkey{
  width:100%;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);border-radius:10px;
  padding:.7rem;font-family:'Inter',system-ui,sans-serif;
  font-size:.9rem;font-weight:600;color:#FAF8F2;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  cursor:pointer;transition:background .15s,border-color .15s;
}
.btn-passkey:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);}

/* status */
.status-msg{
  font-size:.78rem;text-align:center;padding:.5rem;
  border-radius:8px;margin-bottom:.5rem;display:none;
}
.status-msg.error{background:rgba(220,50,50,.15);color:#ff8080;border:1px solid rgba(220,50,50,.3);display:block;}
.status-msg.success{background:rgba(50,180,100,.15);color:#80e8a0;border:1px solid rgba(50,180,100,.3);display:block;}
.status-msg.loading{background:rgba(184,134,47,.12);color:#E3C173;border:1px solid rgba(184,134,47,.25);display:block;}

/* hanko overrides */
hanko-auth{
  --color:#FAF8F2;--color-shade-1:rgba(255,255,255,.5);--color-shade-2:rgba(255,255,255,.3);
  --brand-color:#B8862F;--brand-color-shade-1:#E3C173;
  --background-color:transparent;--error-color:#ff8080;
  --link-color:#E3C173;--border-radius:10px;
  --border-color:rgba(255,255,255,.15);--item-height:46px;
  display:block;margin-bottom:.65rem;
}
/* hide create account link — members only */
hanko-auth::part(link) { display:none; }

/* not a member */
.not-member{
  text-align:center;font-size:.68rem;
  color:rgba(255,255,255,.3);line-height:1.7;
}
.not-member a{color:rgba(184,134,47,.75);font-weight:600;text-decoration:none;}
.not-member a:hover{color:#B8862F;}

.hidden{display:none!important;}
</style>
</head>

function setStatus(msg, kind){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = 'status-msg ' + kind;
}

function showHanko(){
  document.getElementById('hanko-auth').classList.remove('hidden');
  document.getElementById('back-btn-wrap').classList.remove('hidden');
  document.getElementById('pills').classList.add('hidden');
  document.getElementById('panel-first').classList.add('hidden');
  document.getElementById('panel-member').classList.add('hidden');
}

function resetToDefault(){
  document.getElementById('hanko-auth').classList.add('hidden');
  document.getElementById('back-btn-wrap').classList.add('hidden');
  document.getElementById('pills').classList.remove('hidden');
  document.getElementById('panel-first').classList.add('hidden');
  document.getElementById('panel-member').classList.add('hidden');
  document.getElementById('status-msg').className = 'status-msg';
  document.getElementById('pill-first').className = 'pill first';
  document.getElementById('pill-member').className = 'pill member';
  currentPill = null;
}

function selectPill(pill){
  currentPill = pill;
  const pillFirst = document.getElementById('pill-first');
  const pillMember = document.getElementById('pill-member');
  const panelFirst = document.getElementById('panel-first');
  const panelMember = document.getElementById('panel-member');
  const hankoEl = document.getElementById('hanko-auth');

  /* reset hanko and show pills again */
  hankoEl.classList.add('hidden');
  document.getElementById('pills').classList.remove('hidden');

  pillFirst.className = 'pill first' + (pill === 'first' ? ' active-pill' : ' dimmed');
  pillMember.className = 'pill member' + (pill === 'member' ? ' active-pill' : ' dimmed');

  /* remove dimmed so both are always clickable */
  pillFirst.style.pointerEvents = 'auto';
  pillMember.style.pointerEvents = 'auto';

  if(pill === 'first'){
    panelFirst.classList.remove('hidden');
    panelMember.classList.add('hidden');
    setTimeout(() => document.getElementById('email-input').focus(), 100);
  } else {
    panelMember.classList.remove('hidden');
    panelFirst.classList.add('hidden');
  }
  document.getElementById('status-msg').className = 'status-msg';
}

function submitEmail(){
  const email = document.getElementById('email-input').value.trim();
  if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
    setStatus('Please enter a valid email address.', 'error'); return;
  }
  setStatus('Opening Hanko\u2026', 'loading');
  showHanko();
}

async function triggerPasskey(){
  setStatus('Opening passkey\u2026', 'loading');
  try {
    /* Step 1: Initialise the login flow with webauthn capabilities */
    const initResp = await fetch(`${HANKO_API}/login`, {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        input_data: {
          webauthn_available: true,
          webauthn_conditional_mediation_available: false,
          webauthn_platform_authenticator_available: true
        }
      })
    });
    const initData = await initResp.json();
    const csrfToken = initData.csrf_token;
    const flowId = initData.flow_id || initData.id;

    /* Step 2: Find the passkey_login action */
    const actions = initData.actions || initData.state?.actions || {};
    const passkeyAction = Object.values(actions).find(a =>
      a && (a.name === 'passkey_login' || a.href?.includes('passkey_login'))
    );

    if(!passkeyAction){
      console.warn('No passkey action found, falling back to component');
      setStatus('', '');
      showHanko();
      return;
    }

    /* Step 3: Trigger passkey login action */
    const actionHref = passkeyAction.href || `${HANKO_API}/login?action=passkey_login@${flowId}`;
    const actionResp = await fetch(actionHref.startsWith('http') ? actionHref : `${HANKO_API}${actionHref}`, {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ csrf_token: csrfToken, input_data: {} })
    });
    const actionData = await actionResp.json();

    /* Step 4: Get the WebAuthn options from the response */
    const webauthnOptions = actionData.input_data?.public_key || actionData.public_key;
    if(!webauthnOptions){
      console.warn('No WebAuthn options, showing component', actionData);
      setStatus('', '');
      showHanko();
      return;
    }

    /* Step 5: Call browser WebAuthn API */
    webauthnOptions.challenge = base64ToBuffer(webauthnOptions.challenge);
    if(webauthnOptions.allowCredentials){
      webauthnOptions.allowCredentials = webauthnOptions.allowCredentials.map(c => ({
        ...c, id: base64ToBuffer(c.id)
      }));
    }
    const credential = await navigator.credentials.get({ publicKey: webauthnOptions });

    /* Step 6: Finalise */
    const finalAction = actionData.actions?.webauthn_verify_assertion_response;
    const finalHref = finalAction?.href || `${HANKO_API}/login?action=webauthn_verify_assertion_response@${flowId}`;
    await fetch(finalHref.startsWith('http') ? finalHref : `${HANKO_API}${finalHref}`, {
      method: 'POST',
      credentials: 'include',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        csrf_token: actionData.csrf_token || csrfToken,
        input_data: {
          assertion_response: {
            id: credential.id,
            rawId: bufferToBase64(credential.rawId),
            type: credential.type,
            response: {
              authenticatorData: bufferToBase64(credential.response.authenticatorData),
              clientDataJSON: bufferToBase64(credential.response.clientDataJSON),
              signature: bufferToBase64(credential.response.signature),
            }
          }
        }
      })
    });

    setStatus('Verified! Signing you in\u2026', 'success');
    await handleHankoSession();

  } catch(err){
    if(err.name === 'NotAllowedError'){
      setStatus('Passkey cancelled.', 'error');
    } else {
      console.warn('Passkey error, falling back:', err);
      setStatus('', '');
      showHanko();
    }
  }
}

function base64ToBuffer(base64){
  const b64 = base64.replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from(atob(b64), c => c.charCodeAt(0));
}

function bufferToBase64(buffer){
  return btoa(String.fromCharCode(...new Uint8Array(buffer)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

async function handleHankoSession(){
  try {
    const cookies = document.cookie.split(';').map(c => c.trim());
    const hankoToken = cookies.find(c => c.startsWith('hanko='));
    if(!hankoToken){ setStatus('No session found — please try again.', 'error'); return; }

    const jwt = hankoToken.split('=').slice(1).join('=');
    const payload = JSON.parse(atob(jwt.split('.')[1]));
    let email = typeof payload.email === 'string' ? payload.email
      : payload.email?.address || null;

    if(!email && payload.sub){
      try {
        const r = await fetch(`${HANKO_API}/users/${payload.sub}`, { credentials:'include' });
        if(r.ok){ const u = await r.json(); email = u.email || u.emails?.[0]?.address; }
      } catch(e){}
    }

    if(!email){ setStatus('Could not get your email. Please try again.', 'error'); return; }

    if(!db){ setStatus('Not connected. Please try again.', 'error'); return; }
    const { data: players } = await db.from('players')
      .select('id,first_name,last_name,is_committee,active')
      .ilike('email', email).limit(1);

    if(!players || !players.length){
      setStatus('This email isn\u2019t registered. Contact your captain to get access.', 'error');
      await fetch(`${HANKO_API}/sessions/logout`, { method:'DELETE', credentials:'include' });
      return;
    }

    const player = players[0];
    if(player.active === false){
      setStatus('Your account is inactive. Please contact your captain.', 'error'); return;
    }

    sessionStorage.setItem('glgs_player_id', player.id);
    sessionStorage.setItem('glgs_is_committee', player.is_committee ? 'true' : 'false');
    sessionStorage.setItem('glgs_name', player.first_name + ' ' + player.last_name);
    sessionStorage.setItem('glgs_email', email);

    setStatus('Welcome, ' + player.first_name + '! Signing you in\u2026', 'success');
    setTimeout(() => { window.location.href = '/'; }, 900);

  } catch(err){
    console.error('Login error:', err);
    setStatus('Login failed \u2014 please try again.', 'error');
  }
}

window.addEventListener('load', () => {
  const hankoEl = document.getElementById('hanko-auth');
  if(hankoEl){
    hankoEl.addEventListener('onSessionCreated', handleHankoSession);
    hankoEl.addEventListener('hankoAuthSuccess', handleHankoSession);
    hankoEl.addEventListener('success', handleHankoSession);
  }
  /* auto-redirect if already logged in */
  try {
    const cookies = document.cookie.split(';').map(c => c.trim());
    const hankoToken = cookies.find(c => c.startsWith('hanko='));
    if(hankoToken && sessionStorage.getItem('glgs_player_id')){
      window.location.href = '/';
    }
  } catch(e){}
});
</script>
