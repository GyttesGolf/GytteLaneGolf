<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gytte Lane Golf Society — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Work Sans',sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:#0d0d0d;
}

/* ── HERO ── */
.hero{
  background:linear-gradient(160deg,#4B1320 0%,#3a0e18 60%,#2a0b12 100%);
  padding:3rem 1.5rem 5rem;
  display:flex;
  flex-direction:column;
  align-items:center;
  position:relative;
  overflow:hidden;
  flex-shrink:0;
}
/* subtle radial glow */
.hero::before{
  content:'';position:absolute;
  top:-40%;left:50%;transform:translateX(-50%);
  width:600px;height:400px;
  background:radial-gradient(ellipse,rgba(184,134,47,.12) 0%,transparent 70%);
  pointer-events:none;
}
/* large ghost number */
.hero-num{
  position:absolute;bottom:-1rem;right:-1rem;
  font-family:'Archivo',sans-serif;font-size:14rem;font-weight:800;
  color:rgba(184,134,47,.06);line-height:1;
  pointer-events:none;user-select:none;
}
/* horizontal rule lines */
.hero-lines{
  position:absolute;inset:0;
  background:repeating-linear-gradient(
    180deg,
    transparent,transparent 60px,
    rgba(184,134,47,.04) 60px,rgba(184,134,47,.04) 61px
  );
  pointer-events:none;
}
.hero-inner{
  position:relative;z-index:1;
  display:flex;flex-direction:column;align-items:center;gap:1.2rem;
  max-width:400px;width:100%;
}
.logo-ring{
  width:100px;height:100px;border-radius:50%;
  background:rgba(255,255,255,.05);
  border:2px solid rgba(184,134,47,.35);
  display:flex;align-items:center;justify-content:center;
  padding:12px;
  box-shadow:0 0 0 8px rgba(184,134,47,.06),0 16px 40px rgba(0,0,0,.5);
}
.logo-ring img{width:100%;height:100%;object-fit:contain;}
.hero-text{text-align:center;}
.hero-name{
  font-family:'Archivo',sans-serif;font-size:1.6rem;font-weight:800;
  color:#FAF8F2;line-height:1.15;margin-bottom:.35rem;
  letter-spacing:-.01em;
}
.hero-loc{
  font-family:'IBM Plex Mono',monospace;font-size:.65rem;
  text-transform:uppercase;letter-spacing:.12em;color:#B8862F;
}

/* ── FORM CARD ── */
.card-wrap{
  display:flex;justify-content:center;
  padding:0 1.5rem 2.5rem;
  margin-top:-2.5rem;
  position:relative;z-index:2;
  flex:1;
}
.card{
  background:#1a1a1a;
  border-radius:16px;
  padding:2rem 1.8rem;
  width:100%;max-width:420px;
  box-shadow:0 0 0 1.5px rgba(184,134,47,.35),0 24px 48px rgba(0,0,0,.5),0 0 40px rgba(184,134,47,.06);
  border:1.5px solid rgba(184,134,47,.35);
}

/* instruction pills */
.inst-pills{
  display:grid;grid-template-columns:1fr 1fr;
  gap:.5rem;margin-bottom:1.5rem;
}
.pill{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:10px;
  padding:.7rem .8rem;
  display:flex;flex-direction:column;gap:.3rem;
}
.pill-icon{font-size:1.1rem;}
.pill-title{font-size:.72rem;font-weight:600;color:#FAF8F2;}
.pill-desc{font-size:.65rem;color:#888;line-height:1.4;}

/* form elements */
.inp{
  width:100%;
  background:#111;
  border:1.5px solid #2a2a2a;
  border-radius:10px;
  padding:.72rem .9rem;
  font-size:.9rem;
  color:#FAF8F2;
  font-family:'Work Sans',sans-serif;
  margin-bottom:.75rem;
  transition:border-color .2s;
}
.inp:focus{outline:none;border-color:#B8862F;}
.inp::placeholder{color:#444;}

.btn-main{
  width:100%;
  background:linear-gradient(135deg,#B8862F,#E3C173 50%,#B8862F);
  background-size:200% auto;
  border:none;border-radius:10px;
  padding:.78rem;
  font-size:.92rem;font-weight:600;
  color:#0d0d0d;
  cursor:pointer;
  font-family:'Work Sans',sans-serif;
  letter-spacing:.02em;
  margin-bottom:1rem;
  transition:background-position .3s;
}
.btn-main:hover{background-position:right center;}

.or-row{
  display:flex;align-items:center;gap:.6rem;
  margin-bottom:1rem;
}
.or-line{flex:1;height:1px;background:#222;}
.or-txt{
  font-family:'IBM Plex Mono',monospace;
  font-size:.62rem;color:#444;
  text-transform:uppercase;letter-spacing:.06em;
  white-space:nowrap;
}

.btn-passkey{
  width:100%;
  background:transparent;
  border:1.5px solid #2a2a2a;
  border-radius:10px;
  padding:.72rem;
  font-size:.85rem;
  color:#666;
  cursor:pointer;
  font-family:'Work Sans',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
  transition:border-color .2s,color .2s;
}
.btn-passkey:hover{border-color:rgba(184,134,47,.5);color:#B8862F;}

.footer{
  margin-top:1.4rem;
  text-align:center;
  font-size:.68rem;
  color:#444;
  line-height:1.8;
}
.footer a{color:#B8862F;text-decoration:none;}
.footer a:hover{text-decoration:underline;}

/* ── MOBILE ── */
@media(min-width:600px){
  .hero{padding:4rem 2rem 6rem;}
  .logo-ring{width:120px;height:120px;}
  .hero-name{font-size:2rem;}
  .card{padding:2.4rem 2.2rem;}
}
</style>
</head>
